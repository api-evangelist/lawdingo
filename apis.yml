name: Lawdingo
description: Lawdingo is a New York City legal-technology company founded in 2012 by Nikhil Nirmel
  and Dan Langevin, and a Y Combinator Winter 2013 alum backed by Andreessen Horowitz, General
  Catalyst and AltaIR Capital. It launched as a consumer marketplace for talking to a lawyer on
  demand, then pivoted to serving law firms and corporate legal departments with remote paralegals
  and contract attorneys — legal research, litigation drafting, court filing and discovery support —
  delivered through an online platform where clients assign work, share documents, deposit funds and
  track hours. Lawdingo publishes no public API, developer portal or SDKs, and as of this enrichment
  pass its lawdingo.com and www.lawdingo.com domains both return HTTP 404 "Site Not Found" from an
  unpublished Framer site, leaving no live web surface to harvest.
